name: Build & Deploy

on:
    push:
        branches:
        - master
    pull_request:
        branches:
        - master
    workflow_dispatch: {}

# cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:

    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                java: ['17', '21']
        runs-on: ${{ matrix.os }}
        steps:
        -   uses: actions/checkout@v7

        -   name: Set up JDK ${{ matrix.java }} (build) and JDK 8 (test toolchain)
            # installing 8 alongside matrix.java registers both in ~/.m2/toolchains.xml; the
            # last version listed becomes JAVA_HOME/the JDK that runs Maven itself.
            uses: actions/setup-java@v6
            with:
                java-version: |
                    8
                    ${{ matrix.java }}
                distribution: temurin
                cache: maven

        -   name: Build with Maven/JDK ${{ matrix.java }} on ${{ matrix.os }}, tests forked onto JDK 8
            # the jdk8-tests profile forks the test JVM onto the JDK 8 toolchain (see pom.xml) so we
            # verify the targetJdk=8 bytecode actually runs on Java 8, without running the whole build
            # (and its Java-11+-only plugins, e.g. git-commit-id) under JDK 8 itself.
            run: mvn --batch-mode --file pom.xml --activate-profiles jdk8-tests clean verify

    deploy:
        needs: build
        # skip the deploy job for contributors/forks who lack the required secrets
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
        -   uses: actions/checkout@v7

        -   name: Set up Java for deployment to Sonatype snapshot repo
            uses: actions/setup-java@v6
            with:
                java-version: '17'
                distribution: 'temurin'
                cache: maven
                # Sonatype Central Snapshots
                # must match distributionManagement/snapshotRepository/id in pom:
                server-id: central
                server-username: SONATYPE_CENTRAL_USERNAME
                server-password: SONATYPE_CENTRAL_PASSWORD

        -   name: Deploy to Sonatype Central snapshot repo
            run: mvn --batch-mode --file pom.xml --activate-profiles fast deploy
            env:
                SONATYPE_CENTRAL_USERNAME: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
                SONATYPE_CENTRAL_PASSWORD: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}

        -   name: Set up Java for deployment to GitHub Packages
            uses: actions/setup-java@v6
            with:
                java-version: '17'
                distribution: 'temurin'
        -   name: Deploy snapshot to Github packages
            run: mvn --batch-mode --file pom.xml --activate-profiles fast,github-deploy-snapshot-package deploy
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
